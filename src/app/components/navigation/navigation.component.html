<nav class="navbar">
  <div class="nav-container">
    <div class="nav-brand">
      <a routerLink="/" class="brand-link" (click)="closeMobileMenu()">
        <span class="brand-icon">⚔️</span>
        <span class="brand-text">statz</span>
      </a>
    </div>

    <button class="mobile-menu-toggle" (click)="toggleMobileMenu()" aria-label="Toggle menu">
      <span class="hamburger-icon">☰</span>
    </button>

    <div class="nav-content" [class.mobile-open]="mobileMenuOpen()">
      <div class="nav-links">
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link"
          (click)="closeMobileMenu()"
        >
          Dashboard
        </a>
        <a
          routerLink="/heroes"
          routerLinkActive="active"
          class="nav-link"
          (click)="closeMobileMenu()"
        >
          Heroes
        </a>
        <a
          routerLink="/pro-matches"
          routerLinkActive="active"
          class="nav-link"
          (click)="closeMobileMenu()"
        >
          Pro Matches
        </a>
      </div>

      <form class="search-container" (submit)="onSearchSubmit($event)">
        <div class="search-input-wrapper">
          <input
            type="text"
            class="search-input"
            placeholder="Search players..."
            [value]="searchQuery()"
            (input)="onSearchInput($event)"
          />
          <button type="submit" class="search-button" [disabled]="searchQuery().trim().length < 2">
            🔍
          </button>
        </div>
      </form>
    </div>
  </div>
</nav>
